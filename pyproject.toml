[project]
name = "automl-ops"
version = "0.1.0"
description = "Automated ML lifecycle management platform (portfolio project)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "joblib>=1.6.0",
    "pandera>=0.36.0",
    "scikit-learn>=1.9.1",
    "mlflow>=3.18.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.1.8",
    "alembic>=1.20.1",
    "fastapi>=0.162.5",
    "uvicorn>=0.54.0",
    "starlette>=1.10.0",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

# scikit-learn ships no type information (no py.typed marker). Only its imports are relaxed;
# everything else stays under strict checking.
[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: needs the real PostgreSQL server (make db-up); reported as skipped if unreachable"]
