# Continuous integration (Phase 6, Step 36). NOT YET RUN ON GITHUB: it has only been syntax-checked
# locally (see DECISIONS.md). Treat every claim that it passes as unverified until a real run exists.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: automl
          POSTGRES_DB: automl_ops
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U automl -d automl_ops"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_PASSWORD: ci-only-password
      UV_NO_PYTHON_DOWNLOADS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check src scripts tests
      - run: uv run mypy
      - run: uv run python scripts/export_requirements.py --check
      - run: uv run python scripts/db.py upgrade
      - run: uv run pytest -q

  frontend:
    name: Frontend (lint, types, unit tests, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:api
      - run: npm test
      - run: npm run build
      # Production dependencies only. The known development-tooling advisory (D-049) is not gated.
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images and Compose smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create the stack's own secrets (random, CI only)
        run: |
          printf 'AUTOML_FULL_PASSWORD=%s\nAUTOML_FULL_E2E_TOKEN=%s\n' "$(openssl rand -hex 16)" "$(openssl rand -hex 16)" > .env.full
      - name: Build the three images
        run: docker compose -f compose.full.yaml --env-file .env.full build
      - name: Start the stack and wait until every service is healthy
        # postgres is pulled by Compose here because pull_policy is "never" only for the local use;
        # CI pulls it explicitly first.
        run: |
          docker pull postgres:17-alpine
          docker compose -f compose.full.yaml --env-file .env.full up -d --wait
      - name: Health endpoints answer and the stack reports isolation
        run: |
          curl -fsS http://127.0.0.1:28100/health | tee /dev/stderr | grep -q '"at_head":true'
          curl -fsS http://127.0.0.1:28200/health
          curl -fsS -o /dev/null http://127.0.0.1:25173/
      - name: Logs on failure
        if: failure()
        run: docker compose -f compose.full.yaml --env-file .env.full logs --no-color --tail 80
      - name: Stop
        if: always()
        run: docker compose -f compose.full.yaml --env-file .env.full down -v
